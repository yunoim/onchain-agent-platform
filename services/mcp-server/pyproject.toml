[project]
name = "onchain-mcp"
version = "0.1.0"
description = "Read-only Ethereum tools for AI agents, served over the Model Context Protocol"
readme = "README.md"
license = "MIT"
authors = [{ name = "yunoim" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "web3>=7",
]

[project.scripts]
onchain-mcp = "onchain_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
