# Local full stack (Phase 2). Ollama runs on the host; everything else is a container.
#
#   copy .env.example -> .env, then:  docker compose up --build
#   agent:   http://localhost:8080   (POST /ask, GET /healthz, GET /metrics, GET /docs)
#   litellm: http://localhost:4000   (OpenAI-compatible; needs LITELLM_MASTER_KEY)
#   mcp:     http://localhost:8000   (POST /mcp, GET /healthz, GET /metrics)

name: onchain-agent-platform

services:
  mcp-server:
    build: ./services/mcp-server
    image: onchain-mcp-server:dev
    environment:
      ETH_RPC_URL: ${ETH_RPC_URL:-https://ethereum-rpc.publicnode.com}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./services/gateway/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
    # Docker Desktop (Windows/macOS) resolves host.docker.internal to the host loopback,
    # which is where Ollama listens. Do NOT add `extra_hosts: host-gateway` here: on
    # Docker Desktop it overrides that with the Linux VM's bridge IP and breaks the link.
    # On a native Linux host, set OLLAMA_BASE_URL=http://172.17.0.1:11434 (or the host
    # LAN IP) in .env and start Ollama with OLLAMA_HOST=0.0.0.0.
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  agent:
    build: ./services/agent
    image: onchain-agent:dev
    environment:
      LLM_BASE_URL: http://litellm:4000
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
      LLM_MODEL: ${LLM_MODEL:-local-default}
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
