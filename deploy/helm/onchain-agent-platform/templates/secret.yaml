{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Chart-managed Secret for local use. In Phase 4 Terraform creates this object instead
# and the chart is installed with secrets.create=false, secrets.existingSecret=<name>.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oap.secretName" . }}
  labels:
    {{- include "oap.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
