{{- if .Values.ingress.enabled }}
{{- $agent := include "oap.componentName" (dict "root" . "component" "agent") -}}
{{- $litellm := include "oap.componentName" (dict "root" . "component" "litellm") -}}
{{- $mcp := include "oap.componentName" (dict "root" . "component" "mcp-server") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oap.fullname" . }}
  labels:
    {{- include "oap.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.agent }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $agent }}
                port:
                  name: http
    {{- if .Values.ingress.exposeLitellm }}
    - host: {{ .Values.ingress.hosts.litellm }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $litellm }}
                port:
                  name: http
    {{- end }}
    {{- if .Values.ingress.exposeMcpServer }}
    - host: {{ .Values.ingress.hosts.mcpServer }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $mcp }}
                port:
                  name: http
    {{- end }}
{{- end }}
